color:#fff
}
.container{display:flex;height:100vh}
.left{width:70%;padding:12px;margin-right:30%;overflow:auto}
.right{
 width:30%;
 background:#111;
 color:#0f0;
 padding:12px;
 position:fixed;
 right:0;
 top:0;
 height:100%;
 overflow-y:auto;
}
.topbar{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:0;background:rgba(10,33,39,.84);color:#ecfbfb;border:1px solid rgba(111,211,198,.22);backdrop-filter:blur(24px);z-index:10}
.btn{padding:8px 10px;border:none;border-radius:6px;color:#fff;cursor:pointer}
.btn-blue{background:#4dabff}.btn-purple{background:#b06cff}.btn-green{background:#52c41a}
.card{
background:linear-gradient(180deg, rgba(10,33,39,.92), rgba(8,24,29,.96));
border-radius:22px;
padding:14px;
margin-bottom:14px;
border-left:8px solid #5fd3c6;
box-shadow:0 8px 20px rgba(255,119,200,.15)
}
.card.active{border-left:5px solid #28a745;box-shadow:0 0 0 2px #28a74533}
select,input,textarea,button{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid #ccc}
.row{display:flex;gap:6px;margin-top:6px}
.add{background:#28a745;color:#fff;border:none}
.del{background:#dc3545;color:#fff;border:none;flex:.5}
.copy{background:#6c757d;color:#fff;border:none}
.output{height:38%;background:#000;color:#0f0;font-family:monospace}
.output2{height:28%;background:#050;color:#aff;font-family:monospace;margin-top:10px}
.log{margin-top:8px;background:#000;color:#0f0;font-size:12px;padding:6px;height:10%;overflow:auto;border-radius:6px}
</style>
</head>

}

}

function add(k){
 let arr;

if(mode==="universal"){
  arr = data.universal[k];
}
else{

  // sync product ร่วมกัน
  if(k==="iproduct"){
    arr = data.universal.product;
  }else{
    arr = data.image[k];
  }

}
 let i=document.getElementById(k+"_i");
 if(!i.value) return;
 arr.push(i.value);
 i.value="";
 save();render();
}

function delItem(k){
 let arr;

if(mode==="universal"){
  arr = data.universal[k];
}
else{

  // sync product ร่วมกัน
  if(k==="iproduct"){
    arr = data.universal.product;
  }else{
    arr = data.image[k];
  }

}
 let s=document.getElementById(k+"_s");
 if(!confirm("ลบ "+s.value+"?")) return;
 arr.splice(s.selectedIndex,1);
 save();render();
}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

  // ยังไม่ login
  if(!user){
    window.location.replace('./index.html');
    return;
  }

  try{
    const ref = doc(db,'users',user.uid);
    const snap = await getDoc(ref);

    // ไม่มี user doc
    if(!snap.exists()){
      window.location.replace('./index.html');
      return;
    }

    const data = snap.data();

    // ยังไม่อนุมัติ
    if(!data.approved){
      window.location.replace('./index.html');
      return;
    }

    // ผ่าน = เข้า finder ได้

  }catch(err){
    console.error(err);
    window.location.replace('./index.html');
  }

});
</script>


<script type="module">

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import { app } from './firebase-config.js';

const auth = getAuth(app);
const db = getFirestore(app);

const rolePages = {

    user: ['index.html'],

    vip: [
      'index.html',
      'freestyle.html',
      'cartoon.html',
      'finder.html'
    ],

    gold: [
      'index.html',
      'freestyle.html',
      'cartoon.html',
      'finder.html',
      'story.html'
    ],

    admin: ['*']
};

const ADMIN_EMAIL = 'aikhainorth@gmail.com';

onAuthStateChanged(auth, async(user)=>{

    if(!user){
        window.location.href='index.html';
        return;
    }

    let role='user';

    // FIX ADMIN
    if((user.email||'').toLowerCase() === ADMIN_EMAIL.toLowerCase()){

        role='admin';

    }else{

        const snap = await getDoc(
            doc(db,'users',user.uid)
        );

        if(snap.exists()){

            role = snap.data().role || 'user';
        }
    }

    const page =
      window.location.pathname.split('/').pop()
      || 'index.html';

    function canAccess(role,pageName){

        if(role==='admin') return true;

        return (rolePages[role] || [])
            .includes(pageName);
    }

    // block page
    if(!canAccess(role,page)){

        window.location.href='index.html';
        return;
    }

    // hide menu
    document.querySelectorAll('a[href]')
    .forEach(link=>{

        const href=link.getAttribute('href');

        if(
            !href ||
            href.startsWith('http') ||
            href.startsWith('#')
        ) return;

        const targetPage =
            href.split('/').pop();

        if(!canAccess(role,targetPage)){

            const parent =
              link.closest('li') || link;

            parent.style.display='none';
        }
    });

});

</script>

</body>
