let currentPresetKey=null;

function openPresetModal(){

  currentPresetKey=null;

  document.getElementById("presetModalTitle").innerText="➕ เพิ่ม Preset";

  document.getElementById("presetModalName").value="";

  document.getElementById("presetModalText").value="";

  document.getElementById("presetModal").classList.add("show");

}

function editPresetModal(){

  const key=presetSora.value;

  const p=soraPresets[key];

  if(!p) return;

  currentPresetKey=key;

  document.getElementById("presetModalTitle").innerText="✏️ แก้ไข Preset";

  document.getElementById("presetModalName").value=p.name;

  document.getElementById("presetModalText").value=p.text;

  document.getElementById("presetModal").classList.add("show");

}

function closePresetModal(){

  document.getElementById("presetModal").classList.remove("show");

}

function savePresetModal(){

  const name=document.getElementById("presetModalName").value.trim();

  const text=document.getElementById("presetModalText").value.trim();

  if(!name) return alert("กรอกชื่อ Preset");

  const key=name.toLowerCase().replace(/\s+/g,"_");

  soraPresets[key]={
    name:name,
    text:text
  };

  localStorage.setItem(
    LS_PRESET,

function save(){localStorage.setItem(LS,JSON.stringify(data));}

function section(title,key){
  const c=data[key];
  if(!c.enabled) return "";

  if(key==="product"){
    return `
    <div class="card active" id="sec-${key}">
      <h2>${title}</h2>
      <select id="${key}_s" onchange="update()">
        ${c.items.map((v,i)=>
  `<option value="${i}">${v.name}</option>`
).join("")}
      </select>
      <input id="${key}_i" placeholder="เพิ่ม / แก้ไข">
      <div class="row">
        <button class="add" onclick="add('${key}')">➕ เพิ่ม</button>
        <button class="del" onclick="delItem('${key}')">🗑 ลบ</button>
      </div>
    </div>`;
  }

  return `
  <div class="card active" id="sec-${key}">
    <h2>${title}</h2>
    <select id="${key}_s" onchange="update()">
      ${c.items.map((v,i)=>
  `<option value="${i}">${v.name}</option>`
).join("")}
    </select>
    <div class="row">
      <button class="add" onclick="openItemModal('${key}')">➕ เพิ่ม</button>
      <button class="edit-btn" onclick="editItem('${key}')">✏️ แก้ไข</button>
      <button class="del" onclick="delItem('${key}')">🗑 ลบ</button>
    </div>
  </div>`;
}

function render(){
  document.getElementById("menu").innerHTML=
    section("🖼 Preset ภาพ","image")+
    section("📦 สินค้า/ชื่อสินค้า","product")+
    section("🧠 ประเภทงาน","work")+
    section("👤 นายแบบ/นางแบบ","model")+
    section("🎬 สไตล์ VDO","style")+
    section("🌤 บรรยากาศ","mood")+
    section("✍️ สร้างซับไตเติล","subtitle");
  update();
}


let currentModalKey=null;
let currentEditIndex=-1;

function openItemModal(k){
  currentModalKey=k;
  currentEditIndex=-1;
  document.getElementById("modalTitle").innerText="➕ เพิ่มข้อมูล";
  document.getElementById("modalItemName").value="";
  document.getElementById("modalItemText").value="";
  document.getElementById("itemModal").classList.add("show");
}

function editItem(k){
  const s=document.getElementById(k+"_s");
  if(!s) return;
  currentModalKey=k;
  currentEditIndex=Number(s.value);
  document.getElementById("modalTitle").innerText="✏️ แก้ไขข้อมูล";
  const item=data[k].items[s.value];

document.getElementById("modalItemName").value=item.name;
document.getElementById("modalItemText").value=item.text;
  document.getElementById("itemModal").classList.add("show");
}

function closeModal(){
  document.getElementById("itemModal").classList.remove("show");
}

function saveModalItem(){
  const name=document.getElementById("modalItemName").value.trim();
  const detail=document.getElementById("modalItemText").value.trim();

  if(!name && !detail) return alert("กรอกข้อมูลก่อน");

  const itemData={
  name:name,
  text:detail
};

if(currentEditIndex >= 0){
  data[currentModalKey].items[currentEditIndex]=itemData;
}else{
  data[currentModalKey].items.push(itemData);
}

  save();
  render();

  closeModal();
}


function add(k){

  const i=document.getElementById(k+"_i");

  if(!i.value) return;

  data[k].items.push({
    name:i.value,
    text:i.value
  });

  i.value="";

  save();

  render();

}

function delItem(k){
  const s=document.getElementById(k+"_s");
  if(!s) return;
  const item=data[k].items[s.selectedIndex];

  if(!confirm(`ยืนยันการลบ "${item.name}" ?`)) return;
  data[k].items.splice(Number(s.value),1);
  save();
  render();
}

function line(t,k){
  if(!data[k].enabled) return "";
  const s=document.getElementById(k+"_s");
  if(!s) return "";

const item=data[k].items[s.value];

return item
  ? `${t}: ${item.text}\n`
  : "";
}

  const p=soraPresets[presetSora.value];
  result.value =
`######
${p?p.text:""}

### DETAIL ###
${line("You are a professional AI Prompt Engineer specializing in TikTok commercial content production YOUR ROLE: Convert the user's STRUCTURE PROMPT and uploaded Attached product image into a FINAL IMAGE GENERATION PROMPT to the STRUCTURE PROMPT details below, with an aspect ratio of 9:16 and OUTPUT FORMAT: Image Only.","image")}
${line("สินค้า","product")}
${line("ประเภทงาน","work")}
${line("นายแบบ/นางแบบ","model")}
${line("สไตล์","style")}
${line("บรรยากาศ","mood")}
${line("ซับ","subtitle")}`;
}

function resetAll(){Object.keys(data).forEach(k=>data[k].enabled=false);}

function setActiveMode(mode){
  document.getElementById("btnImage")?.classList.remove("active-mode");
  document.getElementById("btnWork")?.classList.remove("active-mode");
  document.getElementById("btnSub")?.classList.remove("active-mode");

  if(mode==="image") document.getElementById("btnImage")?.classList.add("active-mode");
  if(mode==="work") document.getElementById("btnWork")?.classList.add("active-mode");
  if(mode==="sub") document.getElementById("btnSub")?.classList.add("active-mode");
}


function togglePreset(show){
  const el=document.getElementById("presetCard");
  if(el){
    if(show) el.classList.remove("hidden");
    else el.classList.add("hidden");
  }
}

function modeImage(){
  resetAll();
  ["product","image"].forEach(k=>data[k].enabled=true);
  save();
  render();
  togglePreset(false);
  setActiveMode("image");
}

function modeWork(){
  resetAll();
  ["product","work","model","style","mood"].forEach(k=>data[k].enabled=true);
  save();
  render();
  togglePreset(true);
  setActiveMode("work");
}

function modeSub(){
  resetAll();
  ["product","subtitle"].forEach(k=>data[k].enabled=true);
  save();
  render();
  togglePreset(false);
  setActiveMode("sub");
}

function copyText(){
  result.select();
  navigator.clipboard.writeText(result.value);
  alert("Copy prompt for Sora สำเร็จ");
}

        localStorage.removeItem("PROMPT_BUILDER_DATA");
